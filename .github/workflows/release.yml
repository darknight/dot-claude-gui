name: Release

# Builds an unsigned macOS universal2 .dmg via tauri-action.
#
# Triggers:
#  - push of a tag matching v* → builds and publishes a GitHub Release as
#    a draft prerelease, with the dmg attached. Promote to non-draft once
#    you've smoke-tested the artifact.
#  - workflow_dispatch → builds and uploads the dmg as a workflow-run
#    artifact (downloadable from the Actions tab). Useful for ad-hoc
#    builds without cutting a release.
#
# No signing / no notarization yet — first-time users will need to
# right-click → Open or allow the app in Settings > Privacy & Security.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # git-cliff needs full history to generate changelog

      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust targets for universal2
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # On tag push: render the release body from commit history via git-cliff.
      # Skipped on manual dispatch (no tag → nothing meaningful to summarize).
      # NOTE: We avoid orhun/git-cliff-action@v4 — its run.sh uses
      # `stat -f %s` on macOS runners, but BSD stat's %s is atime (not
      # size; size is %z). Result: stat errors with "bad format", the
      # FILESIZE check fails, and the `content` step output is silently
      # never written. We install git-cliff inline instead.
      - name: Generate changelog
        id: changelog
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          GC_VER=2.13.1
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${GC_VER}/git-cliff-${GC_VER}-aarch64-apple-darwin.tar.gz" | tar xz -C /tmp
          BODY="$(/tmp/git-cliff-${GC_VER}/git-cliff --config cliff.toml --latest --strip header)"
          {
            echo "content<<__GC_BODY_EOF__"
            printf '%s\n' "$BODY"
            echo "__GC_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "--- rendered body ---"
          printf '%s\n' "$BODY"

      - name: Build with tauri-action
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty tagName on manual dispatch → tauri-action only builds.
          # On tag push, the tag name (e.g. v1.0.0-beta.1) becomes both the
          # Release tag and the source for __VERSION__ in the release name.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "dot-claude-gui __VERSION__"
          releaseBody: ${{ steps.changelog.outputs.content }}
          releaseDraft: true
          prerelease: true
          args: --target universal-apple-darwin

      # On manual dispatch the tauri-action step skips release upload —
      # attach the produced artifacts to the workflow run so they're still
      # accessible from the Actions UI.
      - name: Upload dmg as workflow artifact (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dot-claude-gui-macos-universal2
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
